<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h2>Expense Tracker</h2>
      </header>
      <section class="balance-section">
        <h4>Your Balance</h4>
        <h1></h1>
        <h1 id="balance">0.00frs</h1>
      </section>
      <section class="inc-exp-container">
        <div>
          <h4>Income</h4>
          <p id="money-plus" class="money plus">+0.00frs</p>
        </div>
        <div>
          <h4>Expense</h4>
          <p id="money-minus" class="money minus">-0.00frs</p>
        </div>
      </section>
      <section class="history-section">
        <h3>History</h3>
        <ul id="list" class="list">
        </ul>
      </section>
      <section class="form-section">
        <h3>Add New Transaction</h3>
        <form id="form">
          <div class="form-control">
            <label for="text">Text</label>
            <input type="text" id="text" placeholder="Enter description..." />
          </div>
          <div class="form-control">
            <label for="amount"
              >Amount <br />(negative - expense, positive - income)</label
            >
            <input type="number" id="amount" placeholder="Enter amount..." />
          </div>
          <button class="btn">Add Transaction</button>
        </form>
      </section>
    </div>
    <script src="./assets/scripts/scripts.js"></script>
  </body>
</html>
